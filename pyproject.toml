[project]
name = "megdialogue"
version = "0.1.0"
description = "Offline low-latency spoken dialogue (VAD→STT→LLM→TTS) for MEG experiments, with per-stage timing logs"
readme = "README.md"
authors = [
    { name = "Corentin Bel", email = "corentin.bel@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "kokoro>=0.9.4",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.9,<2.10",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
megdialogue = "megdialogue.dialogue:main"
