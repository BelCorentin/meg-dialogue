# Laptop prototype, French. TTS = XTTS-v2 cloning a CC0 voice (won the 10-02 bake-off).
language: fr

vad:
  threshold: 0.5
  min_silence_ms: 600
  min_speech_ms: 250
  speech_pad_ms: 150

stt:
  model: large-v3-turbo
  compute_type: int8_float16   # int8 weights: frees ~0.8 GB so gemma stays on GPU next to XTTS

llm:
  base_url: http://localhost:11434/v1
  model: gemma3:4b
  temperature: 0.7
  max_tokens: 120
  seed: 0
  system_prompt: >
    Tu as une conversation orale détendue avec une personne qui participe à une expérience
    d'imagerie cérébrale. Tes phrases sont lues par une voix de synthèse, donc : réponds en
    une à trois phrases courtes, en français parlé naturel, sans listes, sans markdown, sans
    emojis, sans abréviations. Sois chaleureux, curieux et concret : donne un petit avis ou
    une anecdote à toi, puis pose souvent une seule question ouverte qui invite la personne
    à continuer de parler. Tutoie seulement si la personne te tutoie. Ne dis pas que tu es
    une IA sauf si on te le demande. Ta voix est féminine : accorde au féminin quand tu
    parles de toi (« je suis curieuse »).

tts:
  backend: xtts
  voice: voices/fr_female.wav   # or voices/fr_male.wav
  lang_code: fr
  stream_chunk_size: 20
  speed: 1.0

audio:
  in_rate: 16000
  block: 512
  input_device: null
  output_device: null
